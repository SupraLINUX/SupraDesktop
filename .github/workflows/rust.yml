name: Rust experimental validation
on:
  push:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'tools/supra-lab/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'tools/supra-lab/**', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p supra-lab -- evidence
      - name: Verify deterministic fixture
        run: |
          cargo run --locked -p supra-lab -- evidence-repeat
          for fixture in geometry blur corners refraction material window-optics; do
            cmp "evidence/$fixture.ppm" "evidence-repeat/$fixture.ppm"
          done
          sha256sum evidence/*.ppm > evidence/sha256.txt
          python3 -m unittest discover -s tools/supra-lab -p 'test_optics_metrics.py'
          python3 tools/supra-lab/optics_metrics.py evidence
          python3 tools/supra-lab/optics_metrics.py evidence-repeat
          cmp evidence/optics-metrics.json evidence-repeat/optics-metrics.json
          cmp evidence/scene-metrics.json evidence-repeat/scene-metrics.json
          cmp evidence/window-optics-metrics.json evidence-repeat/window-optics-metrics.json
          cat evidence/window-optics-metrics.json
          cat evidence/scene-metrics.json
          python3 tools/supra-lab/encode_png.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supra-lab-geometry
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
  optics-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Same-run release benchmark
        run: |
          mkdir -p benchmark
          rustc --version > benchmark/environment.txt
          cargo --version >> benchmark/environment.txt
          lscpu >> benchmark/environment.txt
          cargo run --release --locked -p supra-lab -- --optics-benchmark benchmark/samples.csv
          python3 tools/supra-lab/summarize_optics_benchmark.py benchmark/samples.csv > benchmark/summary.json
          cat benchmark/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supra-lab-optics-benchmark
          path: benchmark/
          retention-days: 7
          if-no-files-found: warn

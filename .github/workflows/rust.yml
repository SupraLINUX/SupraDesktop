name: Rust experimental validation
on:
  push:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'tools/supra-lab/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'tools/supra-lab/**', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p supra-lab -- evidence
      - name: Verify deterministic fixture
        run: |
          cargo run --locked -p supra-lab -- evidence-repeat
          for fixture in geometry blur corners refraction material; do
            cmp "evidence/$fixture.ppm" "evidence-repeat/$fixture.ppm"
          done
          sha256sum evidence/*.ppm > evidence/sha256.txt
          python3 -m unittest discover -s tools/supra-lab -p 'test_optics_metrics.py'
          python3 tools/supra-lab/optics_metrics.py evidence
          python3 tools/supra-lab/optics_metrics.py evidence-repeat
          cmp evidence/optics-metrics.json evidence-repeat/optics-metrics.json
          python3 tools/supra-lab/encode_png.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supra-lab-geometry
          path: evidence/
          retention-days: 7
          if-no-files-found: warn

name: Smithay upstream candidate lab
on:
  push:
    paths: ['tools/smithay-lab/**', 'tools/wayland-lab/**', '.github/workflows/smithay-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install external lab tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends weston wayland-utils libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri pkg-config
      - name: Install exact lab toolchains
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup toolchain install 1.88.0 --profile minimal
      - name: Resolve reviewed candidate and build with workspace Rust
        run: bash tools/smithay-lab/build.sh evidence
      - name: Collect exact license files and native link inventory
        run: |
          python3 -m unittest discover -s tools/smithay-lab -p 'test_*inventory.py'
          python3 tools/smithay-lab/license_inventory.py evidence "$RUNNER_TEMP/smithay-candidate"
      - name: Probe nested compositor
        run: bash tools/smithay-lab/run.sh evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smithay-candidate-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
